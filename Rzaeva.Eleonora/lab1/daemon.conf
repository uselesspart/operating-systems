# Конфигурация демона (вариант 14).
#
# Формат: произвольное число строк "folder ignfile".
#   folder  - каталог, содержимое которого удаляется, если в нём нет файла ignfile;
#   ignfile - имя файла-«защиты» внутри folder (или абсолютный путь к нему).
# Пути folder могут быть абсолютными или относительными (относительно каталога,
# где лежит этот конфиг).
#
# Первая строка задаёт интервал между проверками в секундах (по умолчанию 20).
interval 20

/tmp/rzaeva_demo/protected keep.txt
/tmp/rzaeva_demo/cleanme .keep
