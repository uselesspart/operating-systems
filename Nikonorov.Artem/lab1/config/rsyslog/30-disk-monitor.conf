# Only events from disk-monitor sent to LOG_LOCAL0 go to the dedicated log.
# stop prevents this matching event from reaching later rsyslog rules.
if ($programname == 'disk-monitor' and $syslogfacility-text == 'local0') then {
    action(type="omfile" file="/var/log/disk_monitor.log" fileOwner="syslog" fileGroup="adm" fileCreateMode="0640")
    stop
}
