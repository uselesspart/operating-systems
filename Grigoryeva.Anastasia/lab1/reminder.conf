# Конфигурационный файл напоминалки.
# Формат строки:  ГГГГ-ММ-ДД ЧЧ:ММ[:СС] [-h|-d|-w] текст
#   -h  повторять каждый час, -d - каждый день, -w - каждую неделю
# Строки, начинающиеся с '#', и пустые строки игнорируются.
# Добавлять события удобнее скриптом ./add_event.sh
#
# Примеры (раскомментируйте и поправьте дату):
# 2030-01-01 09:00 Позвонить маме
# 2030-01-01 09:30 -d Выпить воды
# 2030-01-01 18:00 -w Сдать отчёт
2026-10-20 20:26 Привет из WSL!
