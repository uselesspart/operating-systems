# Проверяем напоминания каждые 10 секунд.
interval=10

# Здесь храним время последнего показа каждого напоминания.
state_dir=./state

# auto: gnome-terminal, konsole, xterm или x-terminal-emulator.
terminal=auto

# События добавляет скрипт ./add_event:
# event YYYY-MM-DD HH:MM [-h|-d|-w] текст сообщения
# например: event 2026-10-27 18:30 -d Сделать перерыв
