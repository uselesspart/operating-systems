# watch <dir> [recursive=yes|no] [events=all|access,modify,attrib,open,close,create,delete,move] [exclude=PATTERNS]
# debounce_ms <N>  - merge repeated MODIFY of one file within N ms

debounce_ms 500

watch demo/inbox   recursive=yes exclude=*.swp,*~,.git
watch demo/shared  recursive=no  events=create,delete,move
